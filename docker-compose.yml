services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      API_KEY: "dev-api-key"
      JWT_SECRET: "dev-jwt-secret"
      DATABASE_URL: "postgresql://postgres:postgres@db:5433/api_db"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: api_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: